[project]
name = "reader"
version = "0.1.0"
description = "Консольная читалка электронных книг: TXT, EPUB, FB2"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.80",
    "lxml>=5.0",
    "charset-normalizer>=3.0",
    "pymupdf>=1.24",
    "pypdf>=6.16.1",
]

[project.scripts]
reader = "reader.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reader"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
